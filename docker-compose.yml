name: youtube

services:
  redis:
    image: d1397258b209
    container_name: redis
    restart: unless-stopped

    ports:
      - '6379:6379'

    volumes:
      - 'C:/Users/dhl/Desktop/volume/redis/youtube:/data'

    command: redis-server --appendonly yes

  postgres:
    image: eb634efa7ee4
    container_name: postgres
    restart: unless-stopped

    ports:
      - '5432:5432'

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: youtube

    volumes:
      - 'C:/Users/dhl/Desktop/volume/pgsql/youtube:/var/lib/postgresql/data'

  minio:
    image: 69b2ec208575
    container_name: minio
    restart: unless-stopped

    ports:
      - '9000:9000'
      - '9001:9001'

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: 12345678
      MINIO_HOST: localhost
      MINIO_PORT: 9000

    volumes:
      - 'C:/Users/dhl/Desktop/volume/minio/youtube:/data'

    command: server /data --console-address ":9001"
